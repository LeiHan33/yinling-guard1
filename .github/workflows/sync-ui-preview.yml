name: Sync UI Preview to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'android/ui-preview.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Deploy preview to gh-pages
        run: |
          git config user.name "LeiHan33"
          git config user.email "271749635+LeiHan33@users.noreply.github.com"
          file -bi android/ui-preview.html
          git fetch origin gh-pages
          git worktree add gh-pages origin/gh-pages
          cp android/ui-preview.html gh-pages/index.html
          cp android/ui-preview.html gh-pages/ui-preview.html
          mkdir -p gh-pages/android
          cp android/ui-preview.html gh-pages/android/ui-preview.html
          touch gh-pages/.nojekyll
          cd gh-pages
          file -bi index.html
          git add index.html ui-preview.html android/ui-preview.html .nojekyll
          if git diff --staged --quiet; then
            echo "No preview changes to deploy."
          else
            git commit -m "Auto-sync UI preview from main (${GITHUB_SHA:0:7})"
            git push origin HEAD:gh-pages
          fi
